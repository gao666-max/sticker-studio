<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>领取作品 · 旗袍表情工坊</title>
<link rel="stylesheet" href="/claim.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f5edde'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23c8452d'/%3E%3C/svg%3E">
</head>
<body>
<main class="claim-shell">
  <header>
    <p class="kicker">STICKER BOOTH / CLAIM</p>
    <h1 id="title">正在打开你的作品…</h1>
    <p class="lede" id="message">请稍候，正在向后台取件。</p>
  </header>

  <section class="loading" id="loading">
    <div class="loader"></div>
    <p>正在连接作品服务</p>
  </section>

  <figure class="work" id="work" hidden>
    <img id="gif" alt="你的 GIF 作品">
    <figcaption><span id="word">作品</span><span>GIF</span></figcaption>
  </figure>

  <div class="actions" id="actions" hidden>
    <a class="primary" id="download" href="#">下载作品</a>
    <button class="text-btn" id="share" type="button">分享作品</button>
  </div>

  <p class="expiry" id="expiry"></p>
  <p class="foot">作品与二维码绑定，过期后请联系现场工作人员。</p>
  <button class="text-btn retry" id="retry" type="button" hidden>重新尝试</button>
</main>
<script src="/claim.js"></script>
</body>
</html>
